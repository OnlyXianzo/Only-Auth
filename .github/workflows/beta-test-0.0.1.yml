name: beta-test-0.0.1

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App
        run: bun tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Decode Windows Certificate
        shell: bash
        run: |
          echo "${{ secrets.WINDOWS_CERT_BASE64 }}" | base64 --decode > src-tauri/windows-cert.pfx

      - name: Sign Windows Executable
        shell: powershell
        run: |
          $exePath = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -ExpandProperty FullName
          signtool sign /f "src-tauri/windows-cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exePath

      - name: Clean up Certificate
        shell: bash
        run: rm -f src-tauri/windows-cert.pfx

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: only-auth-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Debian (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App
        run: bun tauri build --bundles deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: only-auth-debian-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: bun install

      - name: Initialize Android environment
        run: bun tauri android init --ci --skip-targets-install

      - name: Build Android App
        run: bun tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/android.keystore

      - name: Sign Android APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED_APK" app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks src-tauri/android.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out app-release-signed.apk \
            app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner verify app-release-signed.apk
          mkdir -p src-tauri/gen/android/app/build/outputs/apk/release
          cp app-release-signed.apk src-tauri/gen/android/app/build/outputs/apk/release/only-auth-signed.apk

      - name: Clean up Keystore
        run: rm -f src-tauri/android.keystore

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: only-auth-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/release/only-auth-signed.apk
