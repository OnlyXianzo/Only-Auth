[[permission]]
identifier = "allow-app-commands"
description = "Allows invoking our application's specific Rust commands"
commands.allow = [
  "validate_base32",
  "generate_secret",
  "generate_totp_batch",
  "load_vault_data",
  "save_vault_data",
  "argon2id_hash",
  "argon2id_verify",
  "secure_compare",
  "encrypt_backup",
  "decrypt_backup",
  "write_audit_log",
  "read_audit_logs",
  "set_window_screenshot_protection",
  "encrypt_metadata",
  "decrypt_metadata",
  "validate_import_payload",
  "export_file",
  "import_file",
  "is_biometric_supported",
  "verify_biometric",
  "store_secure_credential",
  "get_secure_credential",
  "delete_secure_credential",
  "store_biometric_key",
  "retrieve_biometric_key",
  "delete_biometric_key",
  "is_biometric_enrolled"
]


